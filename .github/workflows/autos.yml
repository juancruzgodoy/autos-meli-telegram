name: Buscar autos

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/autos.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Diagnóstico no envía mensajes; probar_telegram envía una prueba al grupo'
        type: choice
        default: diagnostico
        options:
          - diagnostico
          - probar_telegram
          - buscar_y_enviar

permissions:
  contents: write

concurrency:
  group: autos-meli-telegram
  cancel-in-progress: false

jobs:
  buscar:
    # Activar la variable solo después de validar el acceso real a MeLi.
    if: github.event_name != 'schedule' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar filtros
        run: python -m unittest discover -s tests -v
      - name: Ejecutar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.modo || (github.event_name == 'push' && 'diagnostico') || 'buscar_y_enviar' }}
        shell: bash
        run: |
          case "$MODE" in
            diagnostico) python bot.py --dry-run --sample ;;
            probar_telegram) python bot.py --test-telegram ;;
            buscar_y_enviar) python bot.py ;;
            *) exit 2 ;;
          esac
